mongodb:
  global:
    storageClass: ebs-csi-sc
  #architecture: replicaset
  useStatefulSet: true
  persistence:
    enabled: true
    #existingClaim: datadir-aitrism1-mongodb-0
    storageClass: ebs-csi-sc
  persistentVolumeClaimRetentionPolicy:
    ## @param persistentVolumeClaimRetentionPolicy.enabled Enable Persistent volume retention policy for MongoDB(&reg;) Statefulset
    ##
    enabled: true
    ## @param persistentVolumeClaimRetentionPolicy.whenScaled Volume retention behavior when the replica count of the StatefulSet is reduced
    ##
    whenScaled: Retain
    ## @param persistentVolumeClaimRetentionPolicy.whenDeleted Volume retention behavior that applies when the StatefulSet is deleted
    ##
    whenDeleted: Retain
  service:
    #nameOverride: aitrism1-mongodb
    mongodb_service_name: mongodb://admin:admin@aitrism-mongodb/aitrism-db
    type: LoadBalancer
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
  ports:
    mongo: 27017
  auth:
    rootPassword: admin
    username: "admin"
    password: "admin"
    database: "aitrism-db"
    usernames: [ "admin" ]
    passwords: [ "admin" ]
    databases: [ aitrism-db ]
  bindIP: "0.0.0.0"
kafka_consumer:
  image_kafka: "637423168201.dkr.ecr.us-east-1.amazonaws.com/defend-vardaan:kafka_consumer"
    #repository: 637423168201.dkr.ecr.us-east-1.amazonaws.com/defend-vardaan
    #repository: 637423168201.dkr.ecr.us-east-1.amazonaws.com/aitrism 
  pullPolicy: "Always"
    # Overrides the image tag whose default is the chart appVersion.
    #tag: "kafka_consumer"

