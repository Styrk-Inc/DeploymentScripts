grafana:
  image: "grafana/grafana"
  port: 3000
  nodePort: 31000  # Default NodePort for Grafana, change if needed
  env:
    GF_SECURITY_ADMIN_USER: "Styrk"
    GF_SECURITY_ADMIN_PASSWORD: "Styrk@2024"


rabbitmq:
  image: "rabbitmq:3-management"
  env:
    erlangCookie: "SWQOKODSQALRPCLNMEQG"
    defaultUser: "aitrism"
    defaultPass: "aitrism"
    defaultVhost: "/"
    BROKER_URI: "amqp://aitrism:aitrism@aitrism:5672"
  ports:
    management: 15672
    amqp: 5672

redis:
  image: "redis:7.2.3"
  ports:
    redis: 6379
  env:
    #    BROKER_URI: "amqp://guest:guest@localhost:5672/"
    BACKEND_URI: "redis://aitrism:6379/0"
  persistence:
      enabled: true
      existingClaim: redis-db-aitrism-redis-0
      subPath: "redis"
      accessMode: ReadWriteOnce
      size: 2Gi
 

kafka:
  replicaCount: 1
  image: confluentinc/cp-kafka:latest
  bootstrap_server: "44.219.90.97"
  ports:
    containerPort: 9092
    internalPort: 31092
  env:
    brokerId: "1"
    zookeeperConnect: "zookeeper-service:2181"
    listenerSecurityProtocolMap: "LISTENER_INTERNAL:PLAINTEXT,LISTENER_EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT"
    interBrokerListenerName: "LISTENER_INTERNAL"
    offsetsTopicReplicationFactor: "1"
  imagePullSecrets: regcred3

zookeeper:
  image: zookeeper:3.7.2
  replicaCount: 1
  ports:
    client: 2181
  env:
    clientPort: 2181
    tickTime: 2000

