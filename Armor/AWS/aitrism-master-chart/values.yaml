#Airflow Values.yaml file

airflow:
  dags:
    persistence:
      enabled: true
      storageClassName: ebs-csi-sc # Optional, depending on your cluster setup
      accessMode: ReadWriteOnce
      size: 1Gi

  config:
    core:
      dags_folder: "/opt/airflow/dags"
      # sql_alchemy_conn: "postgresql+psycopg2://styrk:Styrk121@aitrism-postgresql:5432/airflow"
    webserver:
      expose_config: 'True'  # by default this is 'False'
    api:
      auth_backends: airflow.api.auth.backend.basic_auth

  webserver:
    service:
      type: LoadBalancer
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    extraInitContainers:
      - name: create-user
        image: "apache/airflow:2.1.2" # Use the appropriate Airflow image version
        command: ["bash", "-c"]
        args:
          - |
            airflow users create \
              --username Styrk \
              --firstname Styrk \
              --lastname admin \
              --role Admin \
              --email Styrk@styrk.com \
              --password Styrk@2024

    env:
      - name: AIRFLOW__WEBSERVER__AUTHENTICATE
        value: "True"
      - name: AIRFLOW__WEBSERVER__AUTH_BACKEND
        value: "airflow.contrib.auth.backends.password_auth"
      - name: AIRFLOW__CORE__EXECUTOR
        value: "LocalExecutor"
      # - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
      #   value: "sqlite:////usr/local/airflow/airflow.db"
      - name: AIRFLOW__WEBSERVER__ENABLE_PROXY_FIX
        value: "True"
      # - name: AIRFLOW__WEBSERVER__SECRET_KEY
      #   value: "random_secret_key"

  # postgresql:
  #   enabled: true
  #   postgresUser: styrk
  #   postgresPassword: Styrk121


  scheduler:
    startupProbe:
      failureThreshold: 6
      periodSeconds: 300
      timeoutSeconds: 20
      command: ~
    extraInitContainers:
      - name: copy-dags
        image: "637423168201.dkr.ecr.us-east-1.amazonaws.com/defend-vardaan:kafka_consumer"
        command: [ 'sh', '-c', 'cp /app/airflow/dags/* /opt/airflow/dags' ]
        volumeMounts:
          - name: dags
            mountPath: /opt/airflow/dags
      # - name: create-user
      #   image: "apache/airflow:2.1.2" # Use the appropriate Airflow image version
      #   command: ["bash", "-c"]
      #   args:
      #     - |
      #       airflow users create \
      #         --username Styrk \
      #         --firstname Styrk \
      #         --lastname admin \
      #         --role Admin \
      #         --email Styrk@styrk.com \
      #         --password Styrk@2024
        # env:
        # - name: AIRFLOW__CORE__EXECUTOR
        #   value: "LocalExecutor"
        # - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
        #   value: "postgresql+psycopg2://styrk:Styrk121@aitrism-postgresql:5432/airflow"
        # - name: AIRFLOW__CORE__SQL_ALCHEMY_CONN
        #   value: "sqlite:////usr/local/airflow/airflow.db"
        volumeMounts:
          - name: dags
            mountPath: /opt/airflow/dags

  workers:
    persistence:
      enabled: true
      size: 1Gi
    extraInitContainers:
      - name: copy-dags
        image: "637423168201.dkr.ecr.us-east-1.amazonaws.com/defend-vardaan:kafka_consumer"
        command: [ 'sh', '-c', 'cp /app/airflow/dags/* /opt/airflow/dags' ]
        volumeMounts:
          - name: dags
            mountPath: /opt/airflow/dags

  triggerer:
    persistence:
      enabled: true
      size: 1Gi

  dagProcessor:
    extraInitContainers:
      - name: copy-dags
        image: "637423168201.dkr.ecr.us-east-1.amazonaws.com/defend-vardaan:kafka_consumer"
        command: [ 'sh', '-c', 'cp /app/airflow/dags/* /opt/airflow/dags' ]
        volumeMounts:
          - name: aitrism-dags
            mountPath: /opt/airflow/dags

  logs:
    persistence:
      enabled: false
      size: 1Gi
      annotations: { }
      storageClassName:
      existingClaim:
