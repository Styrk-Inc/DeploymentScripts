apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitrism-deployment
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: aitrism
  template:
    metadata:
      labels:
        app: aitrism
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      volumes:
        - name: config
          emptyDir: {}
        - name: {{ .Values.prometheus.configVolumeName }}
          configMap:
            name: prometheus-config
        - name: rabbitmq-config-volume
          configMap:
            name: rabbitmq-config
        - name: config-volume
          configMap:
            name: rabbitmq-setup-script
        - name: rabbitmq-advanced-config-volume
          configMap:
            name: rabbitmq-advanced-config
            items:
              - key: advanced.config
                path: advanced.config
        # - name: web-config
        #   secret:
        #     secretName: prometheus-web-config
        - name: tls-secret
          secret:
            secretName: prometheus-tls
            
      initContainers:
        - name: rabbitmq-setup
          image: "{{ .Values.rabbitmq.image }}"
          command: [ "/bin/sh", "-c" ]
          args:
            - "cp /config/setup.sh /tmp/setup.sh && chmod +x /tmp/setup.sh && /tmp/setup.sh"
          volumeMounts:
            - name: config-volume
              mountPath: /config
          env:
            - name: RABBITMQ_ERLANG_COOKIE
              value: "{{ .Values.rabbitmq.env.erlangCookie }}"
            # Include any other necessary environment variables here
        - name: init-config
          image: busybox
          command: ['sh', '-c', 'echo "$CONFIG_JS" > /config/config.js']
          env:
            - name: CONFIG_JS
              valueFrom:
                configMapKeyRef:
                  name: react-config
                  key: CONFIG_JS
          volumeMounts:
            - name: config
              mountPath: /config      
      containers:
        - name: celery-fastapi
          image: "{{ .Values.fastapi.image_web }}"
          imagePullPolicy: "{{ .Values.imagePullPolicy }}"
          volumeMounts:
            - name: rabbitmq-config-volume
              mountPath: /etc/rabbitmq
              readOnly: true
          workingDir: "{{ .Values.celeryWorker.workingDir }}"
          command: [ "/bin/sh", "-c" ]
          args: [ "/start" ]
          ports:
            - containerPort: {{ .Values.fastapi.port }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ .Values.kafka.bootstrap_server }}:9092
            - name: MONGODB_SVC_NAME
              value: "mongodb://admin:admin@aitrism-mongodb/aitrism-db"
            - name: BROKER_URI
              value: {{ .Values.rabbitmq.env.BROKER_URI }}
            - name: BACKEND_URI
              value: {{ .Values.redis.env.BACKEND_URI }}
            - name: COGNITO_CLIENT_ID
              value: "{{ .Values.fastapi.env.COGNITO_CLIENT_ID }}"
            - name: COGNITO_USER_POOL_ID
              value: "{{ .Values.fastapi.env.COGNITO_USER_POOL_ID }}"
            - name: COGNITO_REGION
              value: "{{ .Values.fastapi.env.COGNITO_REGION }}"
            - name: NEW_USERNAME
              value: "{{ .Values.fastapi.env.NEW_USERNAME }}"
            - name: ADMIN_USER
              value: "{{ .Values.fastapi.env.ADMIN_USER }}"
          envFrom:
            - secretRef:
               name: aitrism-aws
        {{/* Liveness and readiness probes can be uncommented if needed
        livenessProbe:
          httpGet:
            path: /vs/health
            port: {{ .Values.fastapi.port }}
          initialDelaySeconds: 15
          timeoutSeconds: 2
        readinessProbe:
          httpGet:
            path: /vs/health
            port: {{ .Values.fastapi.port }}
          initialDelaySeconds: 5
          timeoutSeconds: 2
        */}}
        - name: prometheus
          image: "{{ .Values.prometheus.image }}"
          ports:
            - containerPort: {{ .Values.prometheus.ports.containerPort }}
          volumeMounts:
            - name: {{ .Values.prometheus.configVolumeName }}
              mountPath: /etc/prometheus
              readOnly: true
            # - name: web-config
            #   mountPath: /etc
            #   subPath: /prometheus/web-config.yml
          #   - name: tls-secret
          #     mountPath: /etc/prometheus/certs
          # args:
          #   - '--config.file=/etc/prometheus/prometheus.yml'
          #   - '--web.config.file=/etc/prometheus/web-config.yml'
          #   # {{- if .Values.prometheus.extraArgs }}
          #   # {{- range .Values.prometheus.extraArgs }}
          #   # - {{ . }}
          #   # {{- end }}
          #   # {{- end }}

        - name: config-reloader
          image: jimmidyson/configmap-reload:v0.3.0
          args:
            - --volume-dir=/etc/prometheus
            - --webhook-url=http://localhost:9090/-/reload
          volumeMounts:
            - name: {{ .Values.prometheus.configVolumeName }}
              mountPath: /etc/prometheus

        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image }}"
          ports:
            - containerPort: {{ .Values.rabbitmq.ports.amqp }}
            - containerPort: {{ .Values.rabbitmq.ports.management }}
          env:
            - name: RABBITMQ_ERLANG_COOKIE
              value: "{{ .Values.rabbitmq.env.erlangCookie }}"
            - name: RABBITMQ_DEFAULT_USER
              value: "{{ .Values.rabbitmq.env.defaultUser }}"
            - name: RABBITMQ_DEFAULT_PASS
              value: "{{ .Values.rabbitmq.env.defaultPass }}"
            - name: RABBITMQ_DEFAULT_VHOST
              value: "{{ .Values.rabbitmq.env.defaultVhost }}"
            - name: BROKER_URI
              value: "{{ .Values.rabbitmq.env.BROKER_URI }}"
            - name: BACKEND_URI
              value: "{{ .Values.redis.env.BACKEND_URI }}"
          volumeMounts:
            - name: rabbitmq-advanced-config-volume
              mountPath: /etc/rabbitmq/advanced.config
              subPath: advanced.config

        - name: grafana
          image: "{{ .Values.grafana.image }}"
          ports:
            - containerPort: {{ .Values.grafana.port }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              value: "{{ .Values.grafana.env.GF_SECURITY_ADMIN_USER }}"
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: "{{ .Values.grafana.env.GF_SECURITY_ADMIN_PASSWORD }}"

        - name: redis
          image: "{{ .Values.redis.image }}"
          ports:
            - containerPort: {{ .Values.redis.ports.redis }}
          env:
            - name: BACKEND_URI
              value: {{ .Values.redis.env.BACKEND_URI }}

        - name: reactapp
          image: "{{ .Values.frontend.image_frontend }}"
          imagePullPolicy: Always
          ports:
            - containerPort: 80 # Container port that React app runs on
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3001"
            - name: REACT_APP_DEFEND_BACKEND_API_ENDPOINT
              value: http://{{ .Values.env.AITRISM_MASTER_DNS }}:8000
          volumeMounts:
            - name: config
              mountPath: /usr/share/nginx/html/config.js
              subPath: config.js
