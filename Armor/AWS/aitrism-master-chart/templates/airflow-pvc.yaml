apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-aitrism-postgresql-0
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ebs-csi-sc
  resources:
    requests:
      storage: 2Gi
