apiVersion: apps/v1
kind: Deployment
metadata:
  name: aitrism-deployment
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: aitrism
  template:
    metadata:
      labels:
        app: aitrism
    spec:
      imagePullSecrets:
        {{- toYaml .Values.imagePullSecrets | nindent 8 }}
      volumes:
        - name: {{ .Values.prometheus.configVolumeName }}
          configMap:
            name: prometheus-config
      containers:
        - name: celery-fastapi
          image: "{{ .Values.fastapi.image }}"
          workingDir: "{{ .Values.celeryWorker.workingDir }}"
          command: [ "/bin/sh", "-c" ]
          args: [ "/start" ]
          ports:
            - containerPort: {{ .Values.fastapi.port }}
          env:
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ include "aitrism-chart.fullname" . }}-kafka:{{ .Values.kafka.ports.containerPort}}
        # Add other containers similarly...
        - name: prometheus
          image: {{ .Values.prometheus.image }}
          ports:
            - containerPort: {{ .Values.prometheus.ports.containerPort }}
          volumeMounts:
            - name: {{ .Values.prometheus.configVolumeName }}
              mountPath: /etc/prometheus
              readOnly: true

        - name: rabbitmq
          image: "{{ .Values.rabbitmq.image }}"
          ports:
            - containerPort: {{ .Values.rabbitmq.ports.amqp }}
            - containerPort: {{ .Values.rabbitmq.ports.management }}
          env:
            - name: RABBITMQ_ERLANG_COOKIE
              value: "{{ .Values.rabbitmq.env.erlangCookie }}"
            - name: RABBITMQ_DEFAULT_USER
              value: "{{ .Values.rabbitmq.env.defaultUser }}"
            - name: RABBITMQ_DEFAULT_PASS
              value: "{{ .Values.rabbitmq.env.defaultPass }}"
            - name: RABBITMQ_DEFAULT_VHOST
              value: "{{ .Values.rabbitmq.env.defaultVhost }}"
            - name: BROKER_URI
              value: "{{ .Values.env.BROKER_URI }}"
            - name: BACKEND_URI
              value: "{{ .Values.env.BACKEND_URI  }}"

        - name: grafana
          image: grafana/grafana
          ports:
            - containerPort: 3000


        - name: redis
          image: "{{ .Values.redis.image}}"
          ports:
            - containerPort: {{ .Values.redis.ports.redis}}

