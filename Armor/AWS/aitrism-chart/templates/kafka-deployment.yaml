apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aitrism-chart.fullname" . }}-kafka
spec:
  replicas: {{ .Values.kafka.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "aitrism-chart.fullname" . }}-kafka
  template:
    metadata:
      labels:
        app: {{ include "aitrism-chart.fullname" . }}-kafka
    spec:
      imagePullSecrets:
        - name: {{ .Values.kafka.imagePullSecrets }}
      containers:
        - name: kafka
          image: {{ .Values.kafka.image }}
          ports:
            - name: containerport
              containerPort: {{ .Values.kafka.ports.containerPort }}
            - name: internalport
              containerPort: {{ .Values.kafka.ports.internalPort}}
          env:
            - name: MY_POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: KAFKA_BROKER_ID
              value: "{{ .Values.kafka.env.brokerId }}"
            - name: KAFKA_ZOOKEEPER_CONNECT
              value: "{{ .Values.kafka.env.zookeeperConnect }}"
            - name: KAFKA_LISTENERS
              value: "LISTENER_INTERNAL://0.0.0.0:{{ .Values.kafka.ports.internalPort }},LISTENER_EXTERNAL://0.0.0.0:{{ .Values.kafka.ports.containerPort }}"
            - name: KAFKA_ADVERTISED_LISTENERS
              value: "LISTENER_INTERNAL://localhost:{{ .Values.kafka.ports.internalPort }},LISTENER_EXTERNAL://{{ include "aitrism-chart.fullname" . }}-kafka.default.svc.cluster.local:{{ .Values.kafka.ports.containerPort }}"
            - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
              value: {{ .Values.kafka.env.listenerSecurityProtocolMap }}
            - name: KAFKA_INTER_BROKER_LISTENER_NAME
              value: {{ .Values.kafka.env.interBrokerListenerName }}
            - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
              value: "{{ .Values.kafka.env.offsetsTopicReplicationFactor }}"
            - name: KAFKA_LOG4J_ROOT_LOGLEVEL
              value: "INFO"
