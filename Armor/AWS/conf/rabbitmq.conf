# Listener settings for AMQP connections
listeners.tcp.default = 0.0.0.0:5672

# Enable management plugin with default listener on port 15672
management.tcp.port = 15672
management.tcp.ip = 0.0.0.0

# Default user settings
default_user = guest
default_pass = guest

# Set to false to disable the default guest user
loopback_users.guest = false

# Set disk free limit to 50MB (adjust as needed)
disk_free_limit.absolute = 50MB

# Enable the default virtual host
default_vhost = /

# Cluster partition handling mode
cluster_partition_handling = autoheal

# Log levels (debug, info, warning, error)
log.default.level = debug
# Set heartbeat timeout (in seconds)
#heartbeat = 6000 #6000
heartbeat = 10000
# Enable or disable SSL (for SSL/TLS connections)
# ssl_options.cacertfile = /path/to/cacert.pem
# ssl_options.certfile = /path/to/cert.pem
# ssl_options.keyfile = /path/to/key.pem
