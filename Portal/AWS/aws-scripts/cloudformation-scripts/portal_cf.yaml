  # Create an Application Load Balancer (ALB) in the public subnet
  ALB:
    Type: 'AWS::ElasticLoadBalancingV2::LoadBalancer'
    Properties:
      Name: 'LLMGuard-ALB'
      Subnets:
        - Ref: PublicSubnet1
        - Ref: PublicSubnet2
      SecurityGroups:
        - !Ref LLMGuardSecurityGroup  # Use the same security group as EC2
      Scheme: 'internet-facing'
      LoadBalancerAttributes:
        - Key: 'idle_timeout.timeout_seconds'
          Value: '60'
      Tags:
        - Key: Name
          Value: 'LLMGuard-ALB'



  # Create Target Groups for different services
  TargetGroupUI:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Name: 'LLM-Guard-TargetGroupUI'  # Name for the target group
      Port: 80
      Protocol: 'HTTP'
      VpcId: !Ref VPC
      TargetType: 'instance'
      HealthCheckPath: '/'
      HealthCheckProtocol: 'HTTP'
      #HealthCheckPort: 'traffic-port'  # Use traffic port for health check, edit to override port
      HealthCheckTimeoutSeconds: 120  # Timeout duration for health checks
      HealthCheckIntervalSeconds: 300  # Interval between health checks
      HealthyThresholdCount: 10  # Number of successful health checks required to consider the target healthy
      UnhealthyThresholdCount: 10  # Number of failed health checks required to consider the target unhealthy
      Matcher:
        HttpCode: '200'  # Expecting HTTP 200 as a success code
      Targets:
        - Id: !Ref Instance  # Register EC2 instance as a target

  TargetGroupDocs:
    Type: 'AWS::ElasticLoadBalancingV2::TargetGroup'
    Properties:
      Name: 'LLM-Guard-TargetGroupDocs'  # Name for the target group
      Port: 80
      Protocol: 'HTTP'
      VpcId: !Ref VPC
      TargetType: 'instance'
      HealthCheckPath: '/docs'
      HealthCheckProtocol: 'HTTP'
      #HealthCheckPort: '8000'  # Use traffic port for health check, edit to override port
      HealthCheckTimeoutSeconds: 120  # Timeout duration for health checks
      HealthCheckIntervalSeconds: 300  # Interval between health checks
      HealthyThresholdCount: 10  # Number of successful health checks required to consider the target healthy
      UnhealthyThresholdCount: 10  # Number of failed health checks required to consider the target unhealthy
      Matcher:
        HttpCode: '200'
      Targets:
        - Id: !Ref Instance  # Register EC2 instance as a target

  # Create Listener and rules for different paths
  # ALBListener:
  #   Type: 'AWS::ElasticLoadBalancingV2::Listener'
