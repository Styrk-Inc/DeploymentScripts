  # Redirect default rule to UI TG so that it will not give css js error for React Applications
  ALBListener:
    Type: 'AWS::ElasticLoadBalancingV2::Listener'
    Properties:
      DefaultActions:
        - Type: 'forward'
          TargetGroupArn: !Ref TargetGroupUI  # Forward to UI Target Group
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: 'HTTP'


  ALBListenerRuleUI:
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'
    Properties:
      ListenerArn: !Ref ALBListener
      Actions:
        - Type: 'forward'
          TargetGroupArn: !Ref TargetGroupUI
      Conditions:
        - Field: 'path-pattern'
          Values:
            - '/'
      Priority: 1

  ALBListenerRuleDocs:
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'
    Properties:
      ListenerArn: !Ref ALBListener
      Actions:
        - Type: 'forward'
          TargetGroupArn: !Ref TargetGroupDocs
      Conditions:
        - Field: 'path-pattern'
          Values:
            - '/docs'
      Priority: 2

  ALBListenerRuleOpenApi:
    Type: 'AWS::ElasticLoadBalancingV2::ListenerRule'
    Properties:
      ListenerArn: !Ref ALBListener
      Actions:
        - Type: 'forward'
          TargetGroupArn: !Ref TargetGroupDocs
      Conditions:
        - Field: 'path-pattern'
          Values:
            - '/openapi.json'
      Priority: 3

Outputs:
  InstancePrivateIP:
    Description: "Private IP Address of the EC2 Instance"
    Value: !GetAtt Instance.PrivateIp
  ALBDNSName:
    Description: "ALB DNS Name"
    Value: !GetAtt ALB.DNSName