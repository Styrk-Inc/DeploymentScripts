apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
      - name: redis
        image: redis:6.2
        ports:
        - containerPort: 6379
        resources:
          requests:
            memory: "1Gi"
            cpu: "512m"
          limits:
            memory: "1Gi"
            cpu: "512m"
