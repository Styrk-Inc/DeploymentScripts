server {
    listen       80;
    server_name  localhost;

    # Add security headers
#    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com; script-src 'self';";
#    add_header Content-Security-Policy "default-src 'self';";
#    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; script-src 'self' http://localhost:8000/;";

#    add_header Content-Security-Policy "default-src 'self' http://localhost http://localhost:8000; font-src 'self' https://fonts.gstatic.com; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; script-src 'self' http://localhost http://localhost:8000;img-src 'self' http://localhost http://localhost:8000 data:;";


    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "no-referrer";

    # Disable TCP timestamp
    # Note: Disabling TCP timestamps is done at the OS level, not in Nginx
 
    # Set HTTP/2 protocol
    # listen 443 ssl http2;
    listen 443 http2;
    # ssl_certificate /path/to/your/certificate.crt;
    # ssl_certificate_key /path/to/your/private.key;

    # Add SSL/TLS security headers (Optional, if using HTTPS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri /index.html;
    }
 
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
